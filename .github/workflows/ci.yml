name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # GitHub's macOS runners are VMs without Neural Engine access, so CI only
    # builds everything and runs the pure unit tests. The hardware tests
    # (tests/hardware.rs, python/tests) must be run locally on Apple Silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (lib, cdylib, ane-top, ane-bench, examples)
        run: cargo build --release --all-targets
      - name: Unit tests (no ANE needed)
        run: cargo test --release --lib
